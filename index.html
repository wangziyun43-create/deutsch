<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--desk);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}

.card{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--faint);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--paper);border:1px solid var(--rule);border-radius:3px;padding:7px 13px;font-size:14px}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.small{padding:3px 8px;font-size:12.5px}

input[type=text],input[type=password],select,textarea{background:#fff;border:1px solid var(--rule);border-radius:3px;padding:7px 9px;width:100%}

<body>
<div class="top">
  <div class="brand">课本 <em>Lehrbuch</em><span class="ver">v1.8</span></div>
  <nav class="nav">
    <a href="#learn" data-v="learn">学习</a>
    <a href="#review" data-v="review">复习</a>
    <a href="#library" data-v="library">书架</a>
    <a href="#kb" data-v="kb">资料库</a>
    <a href="#settings" data-v="settings">设置</a>
  </nav>
</div>
<main id="app"></main>

<script>
"use strict";
/* ============ 基础工具 ============ */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const VERSION = "v1.8";

/* ============ 设置 ============ */
const DEFAULTS = { key:"", model:"claude-sonnet-5-5", level:"A2", rate:"0.9", voice:"" };
function loadSettings(){ try{ return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem("lb_settings")||"{}")); }catch(e){ return Object.assign({}, DEFAULTS); } }
function saveSettings(s){ localStorage.setItem("lb_settings", JSON.stringify(s)); }
let S = loadSettings();

/* ============ IndexedDB ============ */
const DB = {
  _db:null,
  open(){
    if(this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      const r = indexedDB.open("lehrbuch", 2);
      r.onupgradeneeded = () => {
        const d = r.result;
        if(!d.objectStoreNames.contains("pages")) d.createObjectStore("pages", {keyPath:"id"});
        if(!d.objectStoreNames.contains("saved")) d.createObjectStore("saved", {keyPath:"id"});
        if(!d.objectStoreNames.contains("review")) d.createObjectStore("review", {keyPath:"id"});
      };
      r.onsuccess = () => { this._db = r.result; res(this._db); };
      r.onerror = () => rej(r.error);
    });
  },
  async tx(store, mode, fn){
    const d = await this.open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode), st = t.objectStore(store);
      const out = fn(st);
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
      t.onerror = () => rej(t.error);
    });
  },
  put(store, v){ return this.tx(store, "readwrite", st => st.put(v)); },
  get(store, id){ return this.tx(store, "readonly", st => st.get(id)); },
  del(store, id){ return this.tx(store, "readwrite", st => st.delete(id)); },
  all(store){ return this.tx(store, "readonly", st => st.getAll()); }
};

/* ============ 发音 ============ */
let VOICES = [];
function loadVoices(){
  if(!("speechSynthesis" in window)) return;
  VOICES = speechSynthesis.getVoices().filter(v => /^de/i.test(v.lang));
}
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text){
  if(!("speechSynthesis" in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "de-DE";
  const v = VOICES.find(v => v.name === S.voice) || VOICES.find(v => /de-DE/i.test(v.lang)) || VOICES[0];
  if(v) u.voice = v;
  u.rate = parseFloat(S.rate) || 0.9;
  speechSynthesis.speak(u);
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-say]");
  if(b){ e.preventDefault(); speak(b.getAttribute("data-say")); }
});

/* ============ 图片压缩 ============ */
/* 依次尝试三种读法：createImageBitmap → FileReader(data:) → blob: URL。
   有些环境（如嵌入式预览）禁止 blob: 图片，单靠一种会失败。 */
function drawToJpeg(src, w0, h0, maxSide, quality){
  const k = Math.min(1, maxSide / Math.max(w0, h0));
  const w = Math.round(w0*k), h = Math.round(h0*k);
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.getContext("2d").drawImage(src, 0, 0, w, h);
  return c.toDataURL("image/jpeg", quality);
}
function loadImg(src){
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = () => rej(new Error("img")); img.src = src; });
}
function readAsDataURL(file){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(file); });
}
async function compressImage(file, maxSide=1600, quality=0.85){
  if(window.createImageBitmap){
    try{ const bmp = await createImageBitmap(file); const out = drawToJpeg(bmp, bmp.width, bmp.height, maxSide, quality); bmp.close && bmp.close(); return out; }catch(e){}
  }
  try{ const img = await loadImg(await readAsDataURL(file)); return drawToJpeg(img, img.naturalWidth, img.naturalHeight, maxSide, quality); }catch(e){}
  const url = URL.createObjectURL(file);
  try{ const img = await loadImg(url); return drawToJpeg(img, img.naturalWidth, img.naturalHeight, maxSide, quality); }
  catch(e){
    const heic = /heic|heif/i.test(file.type) || /\.hei[cf]$/i.test(file.name);
    throw new Error(heic ? "这是 HEIC 格式，这个浏览器读不了，换成截图或 JPG 再试。" : "图片读取失败：「" + file.name + "」。如果你是在 Claude 的预览窗口里打开的，请部署到 GitHub Pages 后再用。");
  }
  finally{ URL.revokeObjectURL(url); }
}

/* ============ 提示词 ============ */
function mainPrompt(level, knownWords, knownGrammar){
  knownWords = knownWords||[]; knownGrammar = knownGrammar||[];
  return `你是给中文母语者讲解德语教材的老师。学习者水平：${level}。用户发来德语教材页面的照片。
严格按下面格式输出纯文本。不要 markdown 代码块，不要 JSON，不要任何格式之外的开场白或结尾。
每段以单独一行 ===段名=== 开头。字段用 | 分隔，字段内容里不要出现 | 符号。

===META===
TOPIC|本页主题（中文，12字以内）

===TEXT===
照片里德语正文的原样转写，保留分段。练习题的空格用 ___ 表示。页码、页眉可省略。

===SEEN===
从下面「已讲过的词」里，找出在本页出现了的词（包括它们的变形，如复数、变位、过去式），一行写完，用英文逗号分隔，照抄列表里的原形写法。没有就写 -。

===WORDS===
每行一个词：原形|词性|冠词|复数|变化|中文释义|例句德语|例句中文
- 词性只能是 n / v / adj / adv / prep / conj / pron / phr / other 之一
- 冠词：名词写 der/die/das，非名词写 -
- 复数：名词写复数形式（如 die Häuser），无复数写 -，非名词写 -
- 变化：动词写 第三人称单数现在时, 过去式, 完成时（如 fährt, fuhr, ist gefahren）；可分动词原形里用 · 标出前缀（如 an·rufen）；反身动词原形带 sich；需要固定格或介词的写出来（如 + Akk.、an + Akk.）；形容词只在比较级不规则时写；其他写 -
- 例句优先用课本原句
- 挑出对这个水平有学习价值的词，最多 30 个，按课本出现顺序
- 「已讲过的词」不要再写进 WORDS。唯一例外：本页用的是它的另一个意思或新的固定搭配，这时写进 WORDS，中文释义以【新用法】开头，只讲新的意思

===GRAMMAR===
本页涉及的每个语法点写一块，每块以 ## 语法点名称（中文，可带德语术语）开头，下面逐行：
RULE|一两句话说清规则（中文）
TABLE|表头1|表头2|...      （可选：需要变化表时写，第一行表头）
ROW|单元格|单元格|...        （表格每一行一条）
SRC|课本里体现这个语法的原句，用 [[ ]] 括出关键部分
EX|新例句德语|中文           （写 2 到 3 条）
ERR|中国学习者常见错误及纠正（中文）
如果某个语法点在「已讲过的语法」里，不要重讲：只写 ## 语法点名称（复习），下面写一行 REF|对应的那一条（一字不差照抄「已讲过的语法」里的写法），再写 SRC 行（至少一条）。

===PHRASES===
好词好句、固定搭配，每行：德语|中文|可替换句型模板（用 … 表示可替换的部分，没有就写 -）|例句1德语|例句1中文|例句2德语|例句2中文
写 5 到 12 条，优先能直接用在日常生活里的。
每一条都必须带满两条例句，不能省略：例句要是课本以外的新句子，贴近在德国的日常生活（租房、工作、看医生、购物、和朋友聊天等），长度适中，体现这个搭配的典型用法。

已讲过的词：${knownWords.length ? knownWords.join(", ") : "（无）"}

已讲过的语法：${knownGrammar.length ? knownGrammar.join("；") : "（无）"}`;
}

/* ============ API ============ */
/* 流式调用：每收到一段文字就调 onText(累计文本)。返回 {text, usage:{input_tokens, output_tokens}, truncated} */
async function callClaude(content, maxTokens, onText){
  if(!S.key) throw new Error("还没填 API Key，去「设置」里填。");
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{
      "content-type":"application/json",
      "x-api-key":S.key,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body: JSON.stringify({ model:S.model, max_tokens:maxTokens, stream:true, messages:[{role:"user", content}] })
  });
  if(!r.ok){
    const data = await r.json().catch(() => ({}));
    throw new Error("API 报错 " + r.status + "：" + ((data.error && data.error.message) || "未知错误"));
  }
  const usage = { input_tokens:0, output_tokens:0 };
  let text = "", stop = "", buf = "";
  const handle = ev => {
    if(ev.type === "message_start" && ev.message && ev.message.usage){
      const u = ev.message.usage;
      usage.input_tokens = (u.input_tokens||0) + (u.cache_creation_input_tokens||0) + (u.cache_read_input_tokens||0);
      usage.output_tokens = u.output_tokens||0;
    }else if(ev.type === "content_block_delta" && ev.delta && ev.delta.type === "text_delta"){
      text += ev.delta.text; if(onText) onText(text);
    }else if(ev.type === "message_delta"){
      if(ev.usage && ev.usage.output_tokens != null) usage.output_tokens = ev.usage.output_tokens;
      if(ev.delta && ev.delta.stop_reason) stop = ev.delta.stop_reason;
    }else if(ev.type === "error"){
      throw new Error("生成中断：" + ((ev.error && ev.error.message) || "未知错误"));
    }
  };
  const reader = r.body.getReader(), dec = new TextDecoder();
  for(;;){
    const { value, done } = await reader.read();
    if(done) break;
    buf += dec.decode(value, { stream:true });
    let i;
    while((i = buf.indexOf("\n")) >= 0){
      const line = buf.slice(0, i).trim(); buf = buf.slice(i+1);
      if(!line.startsWith("data:")) continue;
      let ev; try{ ev = JSON.parse(line.slice(5)); }catch(e){ continue; }
      handle(ev);
    }
  }
  addUsage(usage);
  return { text, usage, truncated: stop === "max_tokens" };
}

/* 累计用量（存在 localStorage，按月份分） */
function loadUsage(){ try{ return JSON.parse(localStorage.getItem("lb_usage")||"{}"); }catch(e){ return {}; } }
function addUsage(u){
  const all = loadUsage(), m = new Date().toISOString().slice(0,7);
  const cur = all[m] || { input:0, output:0, calls:0 };
  cur.input += u.input_tokens||0; cur.output += u.output_tokens||0; cur.calls += 1;
  all[m] = cur; localStorage.setItem("lb_usage", JSON.stringify(all));
}
const fmtTok = n => n >= 10000 ? (n/1000).toFixed(1) + "k" : String(n||0);

/* ============ 解析 ============ */
function splitSections(raw){
  const out = {};
  let cur = null;
  String(raw||"").replace(/\r/g,"").split("\n").forEach(line => {
    const m = line.match(/^\s*===\s*([A-Z]+)\s*===\s*$/);
    if(m){ cur = m[1]; out[cur] = []; return; }
    if(cur) out[cur].push(line);
  });
  return out;
}
const cells = line => line.split("|").map(s => s.trim());
const dash = s => (!s || s === "-" || s === "—") ? "" : s;

function parseResult(raw){
  const sec = splitSections(raw);
  const res = { topic:"", text:"", seen:[], words:[], grammar:[], phrases:[], spoken:[] };
  res.seen = [...new Set((sec.SEEN||[]).join(",").split(/[,，、\n]/).map(x => x.trim()).filter(x => x && x !== "-" && x !== "—"))];
  (sec.META||[]).forEach(l => { const c = cells(l); if(c[0]==="TOPIC") res.topic = c[1]||""; });
  res.text = (sec.TEXT||[]).join("\n").trim();
  (sec.WORDS||[]).forEach(l => {
    if(!l.includes("|")) return;
    const c = cells(l); if(c.length < 6 || !c[0]) return;
    res.words.push({ lemma:c[0], pos:(c[1]||"").toLowerCase(), art:dash(c[2]).toLowerCase(), plural:dash(c[3]), forms:dash(c[4]), zh:c[5]||"", ex:dash(c[6]), exZh:dash(c[7]) });
  });
  let g = null;
  (sec.GRAMMAR||[]).forEach(l => {
    const t = l.trim(); if(!t) return;
    if(t.startsWith("##")){ g = { title:t.replace(/^#+\s*/,""), rule:"", table:[], src:[], ex:[], err:"", ref:"" }; res.grammar.push(g); return; }
    if(!g){ g = { title:"语法", rule:"", table:[], src:[], ex:[], err:"" }; res.grammar.push(g); }
    const c = cells(t), k = c[0].toUpperCase();
    if(k==="RULE") g.rule = c.slice(1).join(" | ");
    else if(k==="TABLE" || k==="ROW") g.table.push({ head:k==="TABLE", cells:c.slice(1) });
    else if(k==="SRC") g.src.push(c.slice(1).join(" | "));
    else if(k==="EX") g.ex.push({ de:c[1]||"", zh:c[2]||"" });
    else if(k==="ERR") g.err = c.slice(1).join(" | ");
    else if(k==="REF") g.ref = c.slice(1).join(" | ");
  });
  (sec.PHRASES||[]).forEach(l => { if(!l.includes("|")) return; const c = cells(l); if(!c[0]) return; const ex = []; for(let i = 3; i < c.length; i += 2){ if(dash(c[i])) ex.push({ de:c[i], zh:c[i+1]||"" }); } res.phrases.push({ de:c[0], zh:c[1]||"", tpl:dash(c[2]), ex }); });
  (sec.SPOKEN||[]).forEach(l => { if(!l.includes("|")) return; const c = cells(l); if(c[0]) res.spoken.push({ book:c[0], spk:c[1]||"", note:c[2]||"" }); });
  return res;
}
function parseDialog(raw){
  const d = { title:"", titleDe:"", roleA:"A", roleB:"B", lines:[], vocab:[] };
  String(raw||"").replace(/\r/g,"").split("\n").forEach(l => {
    const t = l.trim(); if(!t.includes("|")) return;
    const c = cells(t), k = c[0].toUpperCase();
    if(k==="TITLE"){ d.title = c[1]||""; d.titleDe = c[2]||""; }
    else if(k==="ROLE"){ d.roleA = c[1]||"A"; d.roleB = c[2]||"B"; }
    else if(k==="A" || k==="B") d.lines.push({ who:k, de:c[1]||"", zh:c[2]||"" });
    else if(k==="VOCAB") d.vocab.push({ de:c[1]||"", zh:c[2]||"" });
  });
  return d;
}

/* 找之前讲过的同一个语法点：手动指定 → REF 精确 → 名称精确 → 相似度最高的那个 */
function gramTokens(x){
  x = normGram(x).toLowerCase();
  const t = new Set((x.match(/[a-zäöüß]{4,}/g) || []).map(w => w.slice(0, 6)));
  const zh = x.replace(/[^一-鿿]/g, "");
  for(let i = 0; i < zh.length - 1; i++) t.add(zh.slice(i, i+2));
  return t;
}
function findKnownGram(g, gi){
  const m = PAGE_KNOWN.gramMap; if(!m || !m.size) return null;
  const link = curPage && curPage.gramLinks && curPage.gramLinks[gi];
  if(link && m.has(link)) return m.get(link);
  for(const c of [g.ref, g.title]){ const t = normGram(c); if(t && m.has(t)) return m.get(t); }
  let best = null, bestScore = 0;
  for(const c of [g.ref, g.title].filter(Boolean)){
    const A = gramTokens(c); if(!A.size) continue;
    for(const [k, v] of m){
      const B = gramTokens(k); if(!B.size) continue;
      let n = 0; A.forEach(x => { if(B.has(x)) n++; });
      const sc = n / Math.min(A.size, B.size);
      if(sc > bestScore){ bestScore = sc; best = v; }
    }
  }
  return bestScore >= 0.34 ? best : null;
}

/* 已讲过的词和语法：来自其他所有页（不含当前页）。同一个词保留最早出现的那次。
   before：只算这个时间之前的页（看旧页时，复习词指向更早的讲解） */
const normLemma = s => String(s||"").toLowerCase().replace(/·/g,"").replace(/^sich\s+/,"").replace(/^(der|die|das)\s+/,"").trim();
const normGram = s => String(s||"").replace(/[（(]\s*复习\s*[)）]/g,"").trim();
async function buildKnown(excludeId, before){
  const pages = (await DB.all("pages")).filter(p => p.id !== excludeId && (!before || p.created < before)).sort((a,b) => a.created - b.created);
  const words = new Map(), gram = new Set(), gramMap = new Map();
  pages.forEach(p => {
    const r = parseResult(p.raw);
    r.words.forEach(w => { if(/^【新用法】/.test(w.zh)) return; const k = normLemma(w.lemma); if(k && !words.has(k)) words.set(k, { w, book:p.book, lesson:p.lesson, pageId:p.id, topic:r.topic }); });
    r.grammar.forEach(g => { const t = normGram(g.title); if(t && !/复习/.test(g.title)){ gram.add(t); if(!gramMap.has(t)) gramMap.set(t, { g, book:p.book, lesson:p.lesson, topic:r.topic }); } });
  });
  return { words, grammar:[...gram], gramMap };
}

    ${seen.map(l => { const k = normLemma(l), hit = PAGE_KNOWN.words.get(k); if(!openSeen.has(k)) return "";

    });

    const parsed = parseResult(r.text);
    if(!parsed.words.length && !parsed.grammar.length && !parsed.text) throw new Error("返回内容没解析出来。原始返回开头：" + r.text.slice(0,300));
    Object.assign(page, { raw:r.text, topic:parsed.topic, usage:r.usage, truncated:r.truncated, live:false });

    if(curPage === page){ curParsed = parseResult(page.raw); renderPage(); }
  }

/* 旧页面的好词好句补例句：例句另存在 page.phraseEx，显示时合并 */
function mergeEx(r, p){
  const m = p && p.phraseEx; if(!m) return r;
  r.phrases.forEach(x => { if(!(x.ex||[]).length && m[x.de]) x.ex = m[x.de]; });
  return r;
}
const EXJOB = new Map();   // pageId → {state:"running"|"failed", err}
async function fillExamples(p){
  const todo = mergeEx(parseResult(p.raw), p).phrases.filter(x => !(x.ex||[]).length);
  if(!todo.length || (EXJOB.get(p.id) || {}).state === "running") return;
  EXJOB.set(p.id, { state:"running" });
  if(curPage === p) renderPage();
  const prompt = `给下面每个德语好词好句写两条例句。学习者水平：${S.level}。例句要贴近在德国的日常生活，体现这个搭配的典型用法。
严格按格式输出纯文本，每行一条，不要其他内容，字段用 | 分隔，内容里不要出现 |：
原词句（照抄）|例句1德语|例句1中文|例句2德语|例句2中文

${todo.map(x => x.de + "（" + x.zh + "）").join("\n")}`;
  let r = null, err = null;
  for(let attempt = 0; attempt < 2 && !r; attempt++){   // 失败自动再试一次
    try{ r = await callClaude([{ type:"text", text:prompt }], 3000); }
    catch(e){ err = e; if(attempt === 0) await new Promise(res => setTimeout(res, 2000)); }
  }
  if(!r){ EXJOB.set(p.id, { state:"failed", err:(err && err.message) || "未知错误" }); if(curPage === p) renderPage(); return; }
  const map = Object.assign({}, p.phraseEx);
  r.text.split("\n").forEach(l => {
    const c = cells(l); if(c.length < 3) return;
    const key = todo.find(x => fold(x.de) === fold(c[0].replace(/（.*$/,""))); if(!key) return;
    const ex = []; for(let i = 1; i < c.length; i += 2){ if(dash(c[i])) ex.push({ de:c[i], zh:c[i+1]||"" }); }
    if(ex.length) map[key.de] = ex;
  });
  p.phraseEx = map;
  p.dialogUsage = (p.dialogUsage||[]).concat([r.usage]);
  await DB.put("pages", p);
  EXJOB.set(p.id, { state:"done" });
  if(curPage === p){ curParsed = mergeEx(parseResult(p.raw), p); renderPage(); }
}

/* ============ 资料库：跨所有页的单词 / 语法 / 好词好句 / 口语，可搜索 ============ */
let KB = { tab:"gram", q:"", book:"", star:false, open:new Set() };
const fold = x => String(x||"").toLowerCase().replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss").replace(/·/g,"");
async function buildKB(){
  const pages = (await DB.all("pages")).sort((a,b) => a.created - b.created);
  const words = new Map(), gram = new Map(), phrases = new Map(), spoken = new Map();
  pages.forEach(p => {
    const r = mergeEx(parseResult(p.raw), p), src = { book:p.book, lesson:p.lesson, topic:r.topic, pageId:p.id };
    r.words.forEach(w => { const k = normLemma(w.lemma) + (/^【新用法】/.test(w.zh) ? "|" + w.zh : ""); if(!words.has(k)) words.set(k, { w, src, more:[] }); else words.get(k).more.push(src); });
    r.seen.forEach(l => { const e = words.get(normLemma(l)); if(e) e.more.push(src); });
    r.grammar.forEach(g => {
      const isRev = /复习/.test(g.title), key = normGram(isRev && g.ref ? g.ref : g.title);
      if(!isRev && !gram.has(key)) gram.set(key, { g, src, more:[], srcSents:[] });
      else if(gram.has(key)){ gram.get(key).more.push(src); gram.get(key).srcSents.push(...g.src); }
    });
    r.phrases.forEach(x => { if(!phrases.has(x.de)) phrases.set(x.de, { x, src }); });
    r.spoken.forEach(x => { if(!spoken.has(x.spk)) spoken.set(x.spk, { x, src }); });
  });
  return { words:[...words.values()], gram:[...gram.values()], phrases:[...phrases.values()], spoken:[...spoken.values()] };
}
const srcLabel = s => [s.book || "未分类", s.lesson, s.topic].filter(Boolean).join(" · ");
const srcLink = s => `<a href="#page/${esc(s.pageId)}" style="color:var(--soft)">${esc(srcLabel(s))}</a>`;
function kbText(kind, e){
  if(kind === "words"){ const w = e.w; return [w.art, w.lemma, w.plural, w.forms, w.zh, w.ex, w.exZh].join(" "); }
  if(kind === "gram"){ const g = e.g; return [g.title, g.rule, g.err, ...g.src, ...e.srcSents, ...g.ex.map(x => x.de + " " + x.zh), ...g.table.map(r => r.cells.join(" "))].join(" "); }
  if(kind === "phrases"){ const x = e.x; return [x.de, x.zh, x.tpl, ...(x.ex||[]).map(y => y.de + " " + y.zh)].join(" "); }
  const x = e.x; return [x.book, x.spk, x.note].join(" ");
}
async function viewKB(){
  setNav("kb");
  await loadSaved();
  const kb = await buildKB();
  const books = [...new Set([...kb.words, ...kb.gram].map(e => e.src.book).filter(Boolean))];
  const q = fold(KB.q.trim()).split(/\s+/).filter(Boolean);
  const keep = (kind, e) => {
    if(KB.book && e.src.book !== KB.book && !(e.more||[]).some(m => m.book === KB.book)) return false;
    if(KB.star){
      const id = kind === "words" ? savedId("word", e.w.lemma) : kind === "phrases" ? savedId("phrase", e.x.de) : kind === "spoken" ? savedId("spoken", e.x.spk) : null;
      if(!id || !SAVED.has(id)) return false;

  };
  const L = { words:kb.words.filter(e => keep("words", e)), gram:kb.gram.filter(e => keep("gram", e)), phrases:kb.phrases.filter(e => keep("phrases", e)), spoken:kb.spoken.filter(e => keep("spoken", e)) };
  const tabs = [["gram","语法"],["words","单词"],["phrases","好词好句"]];

  app.innerHTML = `<div class="card">
    <h2>资料库</h2>
    <input id="kbQ" type="text" placeholder="搜索：反身动词、Akkusativ、Wohnung、租房…（ä 可以打成 a）" value="${esc(KB.q)}">
    <div class="row" style="margin-top:8px">

    <div id="kbBody">${body}</div>
  </div>`;
  const qi = $("#kbQ"); let t = null;
  qi.oninput = () => { clearTimeout(t); t = setTimeout(async () => { KB.q = qi.value; const pos = qi.selectionStart; await viewKB(); const n = $("#kbQ"); n.focus(); n.setSelectionRange(pos, pos); }, 250); };
  $("#kbBook").onchange = e => { KB.book = e.target.value; viewKB(); };

  app.querySelectorAll("[data-save-word]").forEach(b => b.onclick = async () => { const e = list[+b.dataset.saveWord]; await toggleSave("word", e.w.lemma, e.w, findSrc(e)); viewKB(); });

/* ============ 单词复习（间隔重复） ============ */
const DAY = 86400000;
const INTERVALS = [1, 2, 4, 7, 14, 30, 60, 120];   // 第 n 档对应的间隔天数
const startOfDay = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
/* 卡片 = 所有页讲过的单词（含【新用法】，单独成卡）。没有复习记录的，从讲解第二天开始到期 */
async function buildDeck(){
  const pages = (await DB.all("pages")).sort((a,b) => a.created - b.created);
  const recs = new Map((await DB.all("review")).map(x => [x.id, x]));
  const deck = new Map();
  pages.forEach(p => {
    parseResult(p.raw).words.forEach(w => {
      const isNew = /^【新用法】/.test(w.zh);
      const id = normLemma(w.lemma) + (isNew ? "|" + w.zh : "");
      if(!id || deck.has(id)) return;
      const rec = recs.get(id);
      deck.set(id, { id, w, book:p.book, lesson:p.lesson, rec, due: rec ? rec.due : startOfDay(p.created) + DAY });
    });
  });
  return [...deck.values()];
}
let RV = { queue:[], i:0, shown:false, book:"", done:0 };
async function viewReview(){
  setNav("review");
  const deck = await buildDeck();
  const books = [...new Set(deck.map(c => c.book).filter(Boolean))];
  const pool = RV.book ? deck.filter(c => c.book === RV.book) : deck;
  const today = startOfDay(Date.now()), endToday = today + DAY;
  const due = pool.filter(c => c.due < endToday).sort((a,b) => a.due - b.due);
  const week = [...Array(7)].map((_, d) => pool.filter(c => c.due >= today + d*DAY && c.due < today + (d+1)*DAY).length);
  week[0] = due.length;
  const days = ["今天","明天"].concat([2,3,4,5,6].map(d => ["周日","周一","周二","周三","周四","周五","周六"][new Date(today + d*DAY).getDay()]));
  const max = Math.max(1, ...week);

  const front = w.lemma;
  app.innerHTML = `<div class="muted" style="margin-bottom:6px">${RV.i+1} / ${RV.queue.length}${c.rec ? "" : " · 第一次复习"}</div>
  <div class="card" style="text-align:center;padding:28px 16px">
    <div class="w-head" style="font-size:28px">${noun ? (RV.shown ? `<span class="art g-${w.art}" style="font-size:22px">${esc(w.art)}</span> ` : `<span class="muted" style="font-size:22px">der / die / das ?</span> `) : ""}<span class="${RV.shown && noun ? "g-" + w.art : ""}">${esc(front)}</span> ${sayBtn(RV.shown ? wordSpeech(w) : w.lemma.replace(/·/g,""))}</div>
    ${isNewUse ? `<div style="margin-top:4px"><span class="pill" style="color:var(--accent);border-color:var(--accent)">新用法</span></div>` : ""}
    ${RV.shown ? `<div style="text-align:left;margin-top:16px;border-top:1px solid var(--rule)">${wordHTML(w, 0, { noSave:true, src:[c.book, c.lesson].filter(Boolean).join(" ") })}</div>`
      : `<div class="muted" style="margin-top:14px">${noun ? "想一想：词性、复数、意思" : "想一想：意思、变化"}</div>`}
  </div>
  <div class="row" style="justify-content:center;gap:10px">
    ${RV.shown ? `<button class="btn" data-grade="0" style="min-width:86px">忘了 <span class="muted">1</span></button>
      <button class="btn" data-grade="1" style="min-width:86px">模糊 <span class="muted">2</span></button>
      <button class="btn primary" data-grade="2" style="min-width:86px">记得 <span class="muted">3</span></button>`
      : `<button class="btn primary" id="rvShow" style="min-width:160px">显示答案 <span style="opacity:.6">空格</span></button>`}
  </div>
  <div class="row" style="justify-content:center;margin-top:16px"><button class="btn small" id="rvQuit">结束这一轮</button></div>`;
  const s = $("#rvShow"); if(s) s.onclick = () => { RV.shown = true; renderCard(); };
  app.querySelectorAll("[data-grade]").forEach(b => b.onclick = () => grade(+b.dataset.grade));
  $("#rvQuit").onclick = () => viewReview();
}
async function grade(g){
  const c = RV.queue[RV.i]; if(!c) return;
  const box0 = c.rec ? c.rec.box : 0;
  const box = g === 0 ? 0 : g === 1 ? box0 : Math.min(box0 + 1, INTERVALS.length - 1);
  const days = g === 0 ? 1 : INTERVALS[box];
  const rec = { id:c.id, box, due: startOfDay(Date.now()) + days*DAY, last:Date.now(), reps:(c.rec ? c.rec.reps : 0) + 1, lapses:(c.rec ? c.rec.lapses : 0) + (g === 0 ? 1 : 0) };
  await DB.put("review", rec);
  c.rec = rec; RV.i++; RV.shown = false; RV.done++;
  renderCard();
}
document.addEventListener("keydown", e => {
  if(location.hash !== "#review" || !RV.queue[RV.i] || /input|select|textarea/i.test(e.target.tagName)) return;
  if(!RV.shown && (e.key === " " || e.key === "Enter")){ e.preventDefault(); RV.shown = true; renderCard(); }
  else if(RV.shown && ["1","2","3"].includes(e.key)){ e.preventDefault(); grade(+e.key - 1); }
});

/* ============ 路由 ============ */
async function route(){
  const h = location.hash.replace(/^#/, "") || "learn";
  if(h.startsWith("page/")){ if(!curPage || curPage.id !== h.slice(5)){ curTab = "words"; practiceSet = new Set(); detailsOpen = false; openSeen = new Set(); openGram = new Set(); } return viewPage(h.slice(5)); }
  curPage = null;
  if(h === "library") return viewLibrary();
  if(h === "review") return viewReview();
  if(h === "kb" || h === "vocab") return viewKB();
  if(h === "settings") return viewSettings();
  return viewLearn();
}
window.addEventListener("hashchange", route);
(async () => {
  try{ await loadSaved(); }catch(e){ console.error(e); }
  if(!S.key && !location.hash) location.hash = "#settings";
  route();
})();

/* 供测试用 */
if(typeof window !== "undefined") window.__lb = { parseResult, parseDialog, splitSections };
</script>
